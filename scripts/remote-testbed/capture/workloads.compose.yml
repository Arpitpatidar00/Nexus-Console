# Runs on the rig's dind daemon. Matches the testbed workloads (PLAN.md §8.3).
name: nexus-testbed
services:
  web:
    image: nginx:1.27-alpine
    ports: ['8080:80']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 2s
      retries: 3
  crashy:
    image: alpine:3.20
    command: ['sh', '-c', 'exit 1']
    restart: unless-stopped
  sick:
    image: nginx:1.27-alpine
    healthcheck:
      test: ['CMD', 'false']
      interval: 2s
      retries: 1
