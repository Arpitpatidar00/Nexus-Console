[package]
name = "stackroost"
version = "0.2.0"
description = "Stackroost — developer desktop console for Homebrew, Ports, Remote Servers, System Doctor, Mac Clean, and Claude Chats"
authors = ["Arpit <arpitpatidarappi01@gmail.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "stackroost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
portable-pty = "0.9.0"
libc = "0.2.186"
tauri-plugin-notification = "2.3.3"
tauri-plugin-global-shortcut = "2"
# bundled: compiles its own sqlite3 — read-only probes + VACUUM on VSCode's
# state.vscdb must not depend on a system libsqlite version.
rusqlite = { version = "0.32", features = ["bundled"] }
# Native NSAlert confirms for destructive ops — the gate lives in Rust, so the
# frontend can't bypass it.
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
blake3 = "1.8.7"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
regex = "1"
security-framework = "3.7.0"

# ponytail: notification plugin + nix land in P5/P7 as needed — not pre-added.
