<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Badge — preview</title>
  </head>
  <body>
    <div id="root" class="sr-ground"></div>
    <script>
      var S = window.Stackroost,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { className: 'sr-flex' },
          h(S.Badge, { dot: true }, 'Not connected'),
          h(S.Badge, { tone: 'success', dot: true }, 'Healthy'),
          h(S.Badge, { tone: 'warning', dot: true }, 'Starting'),
          h(S.Badge, { tone: 'danger', dot: true }, '2 issues'),
          h(S.Badge, { tone: 'info' }, 'Update available'),
          h(S.Badge, { tone: 'ember' }, 'New'),
        ),
      );
    </script>
  </body>
</html>
