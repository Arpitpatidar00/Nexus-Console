<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Button — preview</title>
  </head>
  <body>
    <div id="root" class="sr-ground"></div>
    <script>
      var S = window.Stackroost,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { className: 'sr-stack', style: { gap: '20px' } },
          h(
            'div',
            { className: 'sr-flex' },
            h(S.Button, null, 'Connect'),
            h(S.Button, { variant: 'ember', icon: 'upload' }, 'Deploy'),
            h(S.Button, { variant: 'glass', icon: 'terminal' }, 'Open terminal'),
            h(S.Button, { variant: 'outline' }, 'Logs'),
            h(S.Button, { variant: 'ghost' }, 'Cancel'),
            h(S.Button, { variant: 'destructive', icon: 'stop' }, 'Stop container'),
          ),
          h(
            'div',
            { className: 'sr-flex' },
            h(S.Button, { size: 'sm' }, 'Small'),
            h(S.Button, { size: 'lg' }, 'Large'),
            h(S.Button, {
              size: 'icon',
              variant: 'glass',
              icon: 'restart',
              'aria-label': 'Restart',
            }),
            h(S.Button, { size: 'icon', icon: 'plus', 'aria-label': 'Add server' }),
            h(S.Button, { disabled: true }, 'Disabled'),
          ),
        ),
      );
    </script>
  </body>
</html>
