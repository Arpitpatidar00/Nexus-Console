<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Input — preview</title>
  </head>
  <body>
    <div id="root" class="sr-ground"></div>
    <script>
      var S = window.Stackroost,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          {
            style: {
              display: 'grid',
              gridTemplateColumns: 'repeat(2, minmax(0, 1fr))',
              gap: '20px',
              maxWidth: '640px',
            },
          },
          h(S.Input, {
            label: 'Hostname',
            mono: true,
            placeholder: '10.0.4.12',
            hint: 'IPv4, IPv6 or a DNS name',
          }),
          h(S.Input, { label: 'Label', defaultValue: 'Fameo API' }),
        ),
      );
    </script>
  </body>
</html>
