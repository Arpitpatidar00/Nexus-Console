<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ListRow — preview</title>
  </head>
  <body>
    <div id="root" class="sr-ground"></div>
    <script>
      var S = window.Stackroost,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { className: 'sr-stack', style: { maxWidth: '720px' } },
          h(S.ListRow, {
            icon: 'server',
            title: 'fameo-prod',
            subtitle: 'ubuntu@10.0.4.12:22',
            meta: '12 ms',
            status: h(S.Badge, { tone: 'success', dot: true }, 'Healthy'),
            trailing: h(S.Button, {
              size: 'icon',
              variant: 'ghost',
              icon: 'more',
              'aria-label': 'More for fameo-prod',
            }),
          }),
          h(S.ListRow, {
            icon: 'containers',
            title: 'api-1',
            subtitle: 'ghcr.io/fameo/api:2.4.1',
            meta: 'CPU 3% · 212 MB',
            status: h(S.Badge, { tone: 'warning', dot: true }, 'Restarting'),
            trailing: h(S.Button, {
              size: 'icon',
              variant: 'ghost',
              icon: 'more',
              'aria-label': 'More for api-1',
            }),
          }),
          h(S.ListRow, {
            icon: 'database',
            title: 'postgresql@18',
            subtitle: 'localhost:5432',
            meta: '1.2 GB',
            status: h(S.Badge, { dot: true }, 'Stopped'),
          }),
        ),
      );
    </script>
  </body>
</html>
