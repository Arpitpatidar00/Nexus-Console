<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NavRail — preview</title>
  </head>
  <body>
    <div id="root" class="sr-ground"></div>
    <script>
      var S = window.Stackroost,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { style: { display: 'flex', height: '500px' } },
          h(S.NavRail, {
            active: 'servers',
            items: [
              { id: 'services', icon: 'activity', label: 'Services' },
              { id: 'servers', icon: 'server', label: 'Servers', badge: true },
              { id: 'ports', icon: 'plug', label: 'Ports' },
              { id: 'doctor', icon: 'shield', label: 'Doctor' },
              { id: 'storage', icon: 'drive', label: 'Storage' },
              { id: 'claude', icon: 'message', label: 'Claude Chats' },
            ],
            footer: [{ id: 'settings', icon: 'settings', label: 'Settings' }],
          }),
        ),
      );
    </script>
  </body>
</html>
