<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sparkline — preview</title>
  </head>
  <body>
    <div id="root" class="sr-ground"></div>
    <script>
      var S = window.Stackroost,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { className: 'sr-flex', style: { gap: '32px' } },
          h(S.Sparkline, {
            data: [3, 5, 4, 8, 6, 9, 7, 11, 10],
            width: 200,
            height: 48,
            area: true,
            marker: true,
            label: 'CPU trend',
          }),
          h(S.Sparkline, {
            data: [9, 7, 8, 5, 6, 4, 5, 3, 4],
            width: 200,
            height: 48,
            tone: 'ivory',
            label: 'Memory trend',
          }),
          h(S.Sparkline, {
            data: [2, 3, 2, 4, 3, 6, 5, 7, 6],
            width: 200,
            height: 48,
            tone: 'lime',
            label: 'Requests trend',
          }),
        ),
      );
    </script>
  </body>
</html>
