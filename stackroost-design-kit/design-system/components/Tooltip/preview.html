<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tooltip — preview</title>
  </head>
  <body>
    <div id="root" class="sr-ground"></div>
    <script>
      var S = window.Stackroost,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { className: 'sr-flex', style: { gap: '28px', paddingTop: '36px' } },
          h(
            S.Tooltip,
            { label: 'Restart', open: true },
            h(S.Button, {
              size: 'icon',
              variant: 'glass',
              icon: 'restart',
              'aria-label': 'Restart',
            }),
          ),
          h(
            S.Tooltip,
            { label: 'Open terminal' },
            h(S.Button, {
              size: 'icon',
              variant: 'glass',
              icon: 'terminal',
              'aria-label': 'Open terminal',
            }),
          ),
        ),
      );
    </script>
  </body>
</html>
