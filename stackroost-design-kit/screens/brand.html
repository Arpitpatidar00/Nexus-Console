<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stackroost — Brand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../design-system/tokens.css" />
    <link rel="stylesheet" href="../design-system/components/bundle.css" />
    <style>
      body {
        margin: 0;
      }
    </style>
    <script src="../vendor/react.production.min.js"></script>
    <script src="../vendor/react-dom.production.min.js"></script>
    <script src="../design-system/components/bundle.js"></script>
    <script src="render.js"></script>
  </head>
  <body class="theme-dark">
    <div id="root"></div>
    <template id="src">
      <div
        class="theme-dark sr-ground"
        style="
          width: 1440px;
          height: 900px;
          box-sizing: border-box;
          padding: 48px 56px;
          border-radius: 0;
          display: flex;
          flex-direction: column;
          gap: 28px;
          color: var(--foreground);
          font-family: var(--font-sans);
        "
      >
        <div
          style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px"
        >
          <div style="display: flex; flex-direction: column; gap: 14px">
            <p class="sr-eyebrow">Smoked Glass · brand v2</p>
            <x-import component-from-global-scope="Stackroost.Logo" size="{{logoLg}}"></x-import>
          </div>
          <p class="sr-caption" style="max-width: 360px; text-align: right">
            Three stacked pills for your stack, a warm dot roosting on top. Ivory on smoked, ink on
            frost, one ember signal.
          </p>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
          <div
            class="sr-glass"
            style="
              border-radius: var(--radius-xl);
              height: 320px;
              box-sizing: border-box;
              padding: 24px;
              display: flex;
              flex-direction: column;
              justify-content: space-between;
            "
          >
            <p class="sr-eyebrow">Mark · Smoked</p>
            <div style="display: flex; justify-content: center">
              <img
                src="../design-system/assets/Logos/stackroost-mark-dark.svg"
                width="150"
                height="150"
                alt="Stackroost mark on a dark ground"
              />
            </div>
            <div style="display: flex; justify-content: center">
              <x-import component-from-global-scope="Stackroost.Logo" size="{{logoSm}}"></x-import>
            </div>
          </div>

          <div
            class="theme-light sr-ground"
            style="
              border-radius: var(--radius-xl);
              height: 320px;
              box-sizing: border-box;
              padding: 24px;
              display: flex;
              flex-direction: column;
              justify-content: space-between;
              border: 1px solid var(--hairline);
            "
          >
            <p class="sr-eyebrow">Mark · Frost</p>
            <div style="display: flex; justify-content: center">
              <img
                src="../design-system/assets/Logos/stackroost-mark-light.svg"
                width="150"
                height="150"
                alt="Stackroost mark on a light ground"
              />
            </div>
            <div style="display: flex; justify-content: center">
              <x-import component-from-global-scope="Stackroost.Logo" size="{{logoSm}}"></x-import>
            </div>
          </div>

          <div
            class="sr-glass"
            style="
              border-radius: var(--radius-xl);
              height: 320px;
              box-sizing: border-box;
              padding: 24px;
              display: flex;
              flex-direction: column;
              justify-content: space-between;
            "
          >
            <p class="sr-eyebrow">App icon · glass and dial</p>
            <div style="display: flex; justify-content: center; gap: 12px">
              <img
                src="../design-system/assets/Logos/stackroost-app-icon.svg"
                width="176"
                height="176"
                alt="App icon: smoked glass squircle with the mark"
              />
              <img
                src="../design-system/assets/Logos/stackroost-app-icon-dial.svg"
                width="176"
                height="176"
                alt="App icon variant: ivory dial knob"
              />
            </div>
            <div style="display: flex; justify-content: center; gap: 12px; align-items: flex-end">
              <img
                src="../design-system/assets/Logos/stackroost-app-icon.svg"
                width="64"
                height="64"
                alt="App icon at 64 px"
              />
              <img
                src="../design-system/assets/Logos/stackroost-app-icon.svg"
                width="32"
                height="32"
                alt="App icon at 32 px"
              />
              <img
                src="../design-system/assets/Logos/stackroost-app-icon.svg"
                width="16"
                height="16"
                alt="App icon at 16 px"
              />
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
          <div
            class="sr-glass"
            style="
              border-radius: var(--radius-xl);
              box-sizing: border-box;
              padding: 24px;
              display: flex;
              flex-direction: column;
              gap: 14px;
            "
          >
            <p class="sr-eyebrow">Menu bar · template</p>
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 8px;
                height: 40px;
                padding: 0 16px;
                border-radius: 12px;
                background: #e9eaee;
                color: #000000;
                font:
                  14px -apple-system,
                  system-ui,
                  sans-serif;
              "
            >
              <img
                src="../design-system/assets/Logos/stackroost-menubar-template.svg"
                width="18"
                height="18"
                alt="Menu bar icon, light menu bar"
              /><span>3/5</span>
            </div>
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 8px;
                height: 40px;
                padding: 0 16px;
                border-radius: 12px;
                background: #1c1c1e;
                color: #ffffff;
                font:
                  14px -apple-system,
                  system-ui,
                  sans-serif;
              "
            >
              <img
                src="../design-system/assets/Logos/stackroost-menubar-template.svg"
                width="18"
                height="18"
                alt="Menu bar icon, dark menu bar"
                style="filter: invert(1)"
              /><span>3/5</span>
            </div>
          </div>

          <div
            class="sr-glass"
            style="
              border-radius: var(--radius-xl);
              box-sizing: border-box;
              padding: 24px;
              display: flex;
              flex-direction: column;
              gap: 14px;
            "
          >
            <p class="sr-eyebrow">Palette</p>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="height: 44px; border-radius: 999px; background: #ff7a2f"></div>
                <span class="sr-eyebrow">Ember</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="height: 44px; border-radius: 999px; background: #f4f1ec"></div>
                <span class="sr-eyebrow">Ivory</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div
                  style="
                    height: 44px;
                    border-radius: 999px;
                    background: #141215;
                    border: 1px solid rgba(255, 255, 255, 0.14);
                  "
                ></div>
                <span class="sr-eyebrow">Smoked</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="height: 44px; border-radius: 999px; background: #e7e7ea"></div>
                <span class="sr-eyebrow">Frost</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="height: 44px; border-radius: 999px; background: #5be08f"></div>
                <span class="sr-eyebrow">Healthy</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="height: 44px; border-radius: 999px; background: #f7c64b"></div>
                <span class="sr-eyebrow">Warning</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="height: 44px; border-radius: 999px; background: #ff5a5f"></div>
                <span class="sr-eyebrow">Prod</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="height: 44px; border-radius: 999px; background: #d9f26b"></div>
                <span class="sr-eyebrow">Lime</span>
              </div>
            </div>
          </div>

          <div
            class="sr-glass"
            style="
              border-radius: var(--radius-xl);
              box-sizing: border-box;
              padding: 24px;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <p class="sr-eyebrow">Type</p>
            <span style="font: 600 44px/48px var(--font-display); letter-spacing: -0.03em"
              >Outfit 68.5%</span
            >
            <span style="font: 400 15px/22px var(--font-sans); color: var(--muted-foreground)"
              >Display, UI and measured numbers.</span
            >
            <span style="font: 500 16px/22px var(--font-mono); color: var(--ember-text)"
              >ssh fameo-prod · Geist Mono</span
            >
          </div>
        </div>
      </div>
    </template>
    <script>
      renderScreen({ logoLg: 64, logoSm: 30 });
    </script>
  </body>
</html>
