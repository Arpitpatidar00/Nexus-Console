<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stackroost — Command dial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../design-system/tokens.css" />
    <link rel="stylesheet" href="../design-system/components/bundle.css" />
    <style>
      body {
        margin: 0;
      }
    </style>
    <script src="../vendor/react.production.min.js"></script>
    <script src="../vendor/react-dom.production.min.js"></script>
    <script src="../design-system/components/bundle.js"></script>
    <script src="render.js"></script>
  </head>
  <body class="theme-dark">
    <div id="root"></div>
    <template id="src">
      <div
        class="theme-dark sr-ground"
        style="
          min-height: 900px;
          box-sizing: border-box;
          padding: 40px 16px;
          border-radius: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          color: var(--foreground);
          font-family: var(--font-sans);
        "
      >
        <div
          role="dialog"
          aria-label="Command dial"
          class="sr-glass"
          style="
            width: 100%;
            max-width: 1120px;
            box-sizing: border-box;
            padding: 32px;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-float);
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            align-items: center;
          "
        >
          <div
            style="
              flex: 1 1 520px;
              min-width: 0;
              display: flex;
              flex-direction: column;
              gap: 16px;
              overflow-x: auto;
            "
          >
            <p class="sr-eyebrow">Jump to</p>
            <x-import
              component-from-global-scope="Stackroost.CommandDial"
              items="{{dial}}"
              active="servers"
              label="Modules"
            ></x-import>
          </div>

          <div
            style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 14px"
          >
            <x-import
              component-from-global-scope="Stackroost.SearchField"
              placeholder="Type a command or a name"
              default-value="restart api"
              shortcut="esc"
              label="Command"
            ></x-import>
            <p class="sr-eyebrow" style="margin-top: 6px">Actions</p>
            <x-import
              component-from-global-scope="Stackroost.ListRow"
              icon="restart"
              title="Restart api-1"
              subtitle="fameo-prod · container"
              class-name="sr-row--on"
              ><x-import component-from-global-scope="Stackroost.EnvBadge" env="prod"></x-import
              ><span class="sr-kbd">↵</span></x-import
            >
            <x-import
              component-from-global-scope="Stackroost.ListRow"
              icon="restart"
              title="Restart api-1"
              subtitle="fameo-staging · container"
              ><x-import component-from-global-scope="Stackroost.EnvBadge" env="staging"></x-import
            ></x-import>
            <x-import
              component-from-global-scope="Stackroost.ListRow"
              icon="list"
              title="Live logs for api-1"
              subtitle="fameo-prod · opens in the terminal drawer"
            ></x-import>
            <p class="sr-eyebrow" style="margin-top: 6px">Also</p>
            <x-import
              component-from-global-scope="Stackroost.ListRow"
              icon="tunnel"
              title="Open tunnel prod-db → :5433"
              subtitle="fameo-prod · postgres"
            ></x-import>
            <x-import
              component-from-global-scope="Stackroost.ListRow"
              icon="plug"
              title="Kill port 3000"
              subtitle="node · Detached"
            ></x-import>
            <div
              style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 4px"
              class="sr-caption"
            >
              <span><span class="sr-kbd">↑↓</span> move</span>
              <span><span class="sr-kbd">←→</span> turn the dial</span>
              <span><span class="sr-kbd">↵</span> run</span>
            </div>
          </div>
        </div>
      </div>
    </template>
    <script>
      renderScreen({
        dial: [
          { id: 'servers', icon: 'server', label: 'Servers' },
          { id: 'services', icon: 'activity', label: 'Services' },
          { id: 'ports', icon: 'plug', label: 'Ports' },
          { id: 'terminal', icon: 'terminal', label: 'Terminal' },
          { id: 'doctor', icon: 'shield', label: 'Doctor' },
          { id: 'storage', icon: 'drive', label: 'Storage' },
          { id: 'claude', icon: 'message', label: 'Claude Chats' },
          { id: 'settings', icon: 'settings', label: 'Settings' },
        ],
      });
    </script>
  </body>
</html>
