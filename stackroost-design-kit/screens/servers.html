<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stackroost — Servers (Smoked)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../design-system/tokens.css" />
    <link rel="stylesheet" href="../design-system/components/bundle.css" />
    <style>
      body {
        margin: 0;
      }
    </style>
    <script src="../vendor/react.production.min.js"></script>
    <script src="../vendor/react-dom.production.min.js"></script>
    <script src="../design-system/components/bundle.js"></script>
    <script src="render.js"></script>
  </head>
  <body class="theme-dark">
    <div id="root"></div>
    <template id="src">
      <div
        class="theme-dark sr-ground"
        style="
          min-height: 980px;
          box-sizing: border-box;
          padding: 16px;
          border-radius: 0;
          display: flex;
          flex-wrap: wrap;
          gap: 20px;
          align-items: flex-start;
          color: var(--foreground);
          font-family: var(--font-sans);
        "
      >
        <x-import
          component-from-global-scope="Stackroost.NavRail"
          items="{{navItems}}"
          footer="{{navFoot}}"
          active="servers"
          label="Modules"
        ></x-import>

        <main
          style="
            flex: 999 1 560px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 8px 8px 8px 4px;
          "
        >
          <header
            style="
              display: flex;
              flex-wrap: wrap;
              justify-content: space-between;
              align-items: center;
              gap: 16px;
            "
          >
            <div style="display: flex; flex-direction: column; gap: 4px">
              <h1 class="sr-h-display">Servers</h1>
              <p class="sr-caption">9 servers · 3 projects · 7 connected · checked 12 s ago</p>
            </div>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
              <x-import
                component-from-global-scope="Stackroost.SearchField"
                placeholder="Search hosts, containers, ports"
                shortcut="⌘K"
                label="Search servers"
                style="width: 340px; max-width: 100%"
              ></x-import>
              <x-import
                component-from-global-scope="Stackroost.Button"
                variant="glass"
                size="icon"
                icon="bell"
                aria-label="Notifications"
              ></x-import>
              <x-import
                component-from-global-scope="Stackroost.Button"
                size="icon"
                icon="plus"
                aria-label="Add server"
              ></x-import>
            </div>
          </header>

          <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
            <x-import
              component-from-global-scope="Stackroost.Panel"
              title="Hosts"
              subtitle="Grouped by project, prod last"
              action-label="Check all"
              action-icon="restart"
              style="flex: 1 1 320px; min-width: 0"
            >
              <p class="sr-eyebrow" style="margin-top: 4px">Fameo</p>
              <x-import
                component-from-global-scope="Stackroost.ListRow"
                icon="server"
                title="fameo-dev"
                subtitle="ubuntu@10.0.4.10"
                ><x-import
                  component-from-global-scope="Stackroost.Badge"
                  tone="success"
                  dot="{{yes}}"
                  >Healthy</x-import
                ></x-import
              >
              <x-import
                component-from-global-scope="Stackroost.ListRow"
                icon="server"
                title="fameo-staging"
                subtitle="ubuntu@10.0.4.11"
                ><x-import
                  component-from-global-scope="Stackroost.Badge"
                  tone="success"
                  dot="{{yes}}"
                  >Healthy</x-import
                ></x-import
              >
              <x-import
                component-from-global-scope="Stackroost.ListRow"
                icon="server"
                title="fameo-prod"
                subtitle="ubuntu@10.0.4.12"
                class-name="sr-row--on"
                ><x-import
                  component-from-global-scope="Stackroost.Badge"
                  tone="danger"
                  dot="{{yes}}"
                  >2 issues</x-import
                ></x-import
              >
              <p class="sr-eyebrow" style="margin-top: 8px">Shop</p>
              <x-import
                component-from-global-scope="Stackroost.ListRow"
                icon="server"
                title="shop-dev"
                subtitle="deploy@172.31.8.20"
                ><x-import
                  component-from-global-scope="Stackroost.Badge"
                  tone="success"
                  dot="{{yes}}"
                  >Healthy</x-import
                ></x-import
              >
              <x-import
                component-from-global-scope="Stackroost.ListRow"
                icon="server"
                title="shop-staging"
                subtitle="deploy@172.31.8.21"
                ><x-import
                  component-from-global-scope="Stackroost.Badge"
                  tone="warning"
                  dot="{{yes}}"
                  >Load high</x-import
                ></x-import
              >
              <x-import
                component-from-global-scope="Stackroost.ListRow"
                icon="server"
                title="shop-prod"
                subtitle="deploy@172.31.8.22"
                ><x-import
                  component-from-global-scope="Stackroost.Badge"
                  tone="success"
                  dot="{{yes}}"
                  >Healthy</x-import
                ></x-import
              >
              <p class="sr-eyebrow" style="margin-top: 8px">Ops</p>
              <x-import
                component-from-global-scope="Stackroost.ListRow"
                icon="server"
                title="ops-dev"
                subtitle="ubuntu@10.2.0.4"
                ><x-import component-from-global-scope="Stackroost.Badge" dot="{{yes}}"
                  >Not connected</x-import
                ></x-import
              >
              <x-import
                component-from-global-scope="Stackroost.ListRow"
                icon="server"
                title="ops-staging"
                subtitle="ubuntu@10.2.0.5"
                ><x-import component-from-global-scope="Stackroost.Badge" dot="{{yes}}"
                  >Not connected</x-import
                ></x-import
              >
              <x-import
                component-from-global-scope="Stackroost.ListRow"
                icon="server"
                title="ops-prod"
                subtitle="ubuntu@10.2.0.6"
                ><x-import
                  component-from-global-scope="Stackroost.Badge"
                  tone="success"
                  dot="{{yes}}"
                  >Healthy</x-import
                ></x-import
              >
            </x-import>

            <section
              style="
                flex: 999 1 560px;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 20px;
              "
              aria-label="fameo-prod"
            >
              <div
                style="
                  display: flex;
                  flex-wrap: wrap;
                  justify-content: space-between;
                  align-items: flex-end;
                  gap: 16px;
                "
              >
                <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
                  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
                    <h2 class="sr-h-lg">fameo-prod</h2>
                    <x-import
                      component-from-global-scope="Stackroost.EnvBadge"
                      env="prod"
                    ></x-import>
                    <x-import
                      component-from-global-scope="Stackroost.Badge"
                      tone="danger"
                      dot="{{yes}}"
                      >2 issues</x-import
                    >
                  </div>
                  <p class="sr-eyebrow">ubuntu@10.0.4.12:22 · Ubuntu 24.04 LTS · up 14 d · 18 ms</p>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 10px">
                  <x-import
                    component-from-global-scope="Stackroost.Button"
                    variant="glass"
                    icon="terminal"
                    >Terminal</x-import
                  >
                  <x-import
                    component-from-global-scope="Stackroost.Button"
                    variant="glass"
                    icon="tunnel"
                    >Tunnels</x-import
                  >
                  <x-import component-from-global-scope="Stackroost.Button" icon="restart"
                    >Check now</x-import
                  >
                </div>
              </div>

              <x-import
                component-from-global-scope="Stackroost.Segmented"
                options="{{sections}}"
                default-value="Overview"
                label="Host sections"
              ></x-import>

              <div style="display: flex; flex-wrap: wrap; gap: 20px">
                <x-import
                  component-from-global-scope="Stackroost.Panel"
                  style="flex: 1 1 220px; min-width: 0"
                  aria-label="Disk"
                >
                  <x-import
                    component-from-global-scope="Stackroost.Metric"
                    value="68.5"
                    unit="%"
                    label="Disk used · /"
                    tone="ember"
                    progress="{{p68}}"
                  ></x-import>
                </x-import>
                <x-import
                  component-from-global-scope="Stackroost.Panel"
                  style="flex: 1 1 220px; min-width: 0"
                  aria-label="Memory"
                >
                  <x-import
                    component-from-global-scope="Stackroost.Metric"
                    value="5.1"
                    unit="GB"
                    label="Memory · of 8 GB"
                    tone="success"
                    progress="{{p64}}"
                  ></x-import>
                </x-import>
                <x-import
                  component-from-global-scope="Stackroost.Panel"
                  style="flex: 1 1 220px; min-width: 0"
                  aria-label="Load"
                >
                  <x-import
                    component-from-global-scope="Stackroost.Metric"
                    value="0.42"
                    label="Load, 5 min · 4 cores"
                    tone="success"
                    spark="{{load}}"
                  ></x-import>
                </x-import>
              </div>

              <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
                <x-import
                  component-from-global-scope="Stackroost.Panel"
                  title="Containers"
                  subtitle="compose · fameo · 4 running"
                  action-label="Logs"
                  action-icon="list"
                  style="flex: 2 1 380px; min-width: 0"
                >
                  <x-import
                    component-from-global-scope="Stackroost.ListRow"
                    icon="containers"
                    title="api-1"
                    subtitle="ghcr.io/fameo/api:2.4.1"
                    meta="6 restarts"
                    ><x-import
                      component-from-global-scope="Stackroost.Badge"
                      tone="warning"
                      dot="{{yes}}"
                      >Restarting</x-import
                    ></x-import
                  >
                  <x-import
                    component-from-global-scope="Stackroost.ListRow"
                    icon="containers"
                    title="web"
                    subtitle="ghcr.io/fameo/web:2.4.1"
                    meta="CPU 2% · 180 MB"
                    ><x-import
                      component-from-global-scope="Stackroost.Badge"
                      tone="success"
                      dot="{{yes}}"
                      >Healthy</x-import
                    ></x-import
                  >
                  <x-import
                    component-from-global-scope="Stackroost.ListRow"
                    icon="containers"
                    title="worker"
                    subtitle="ghcr.io/fameo/worker:2.4.1"
                    meta="CPU 7% · 312 MB"
                    ><x-import
                      component-from-global-scope="Stackroost.Badge"
                      tone="success"
                      dot="{{yes}}"
                      >Healthy</x-import
                    ></x-import
                  >
                  <x-import
                    component-from-global-scope="Stackroost.ListRow"
                    icon="database"
                    title="postgres"
                    subtitle="postgres:16-alpine"
                    meta="CPU 4% · 1.1 GB"
                    ><x-import
                      component-from-global-scope="Stackroost.Badge"
                      tone="success"
                      dot="{{yes}}"
                      >Healthy</x-import
                    ></x-import
                  >
                </x-import>

                <x-import
                  component-from-global-scope="Stackroost.Panel"
                  variant="inverse"
                  title="2 issues need you"
                  subtitle="Found on the last check."
                  action-label="Open logs"
                  action-icon="list"
                  style="flex: 1 1 260px; min-width: 0"
                >
                  <div
                    style="
                      display: flex;
                      flex-direction: column;
                      gap: 14px;
                      font: 400 14px/20px var(--font-sans);
                    "
                  >
                    <div style="display: flex; flex-direction: column; gap: 2px">
                      <strong style="font-weight: 600">api-1 keeps restarting</strong
                      ><span style="opacity: 0.8">6 restarts in 10 min, exit code 1.</span>
                    </div>
                    <div style="height: 1px; background: currentColor; opacity: 0.12"></div>
                    <div style="display: flex; flex-direction: column; gap: 2px">
                      <strong style="font-weight: 600">Reboot required</strong
                      ><span style="opacity: 0.8"
                        >A kernel update is waiting. Reboot from a terminal when it suits you.</span
                      >
                    </div>
                  </div>
                </x-import>
              </div>

              <x-import
                component-from-global-scope="Stackroost.Panel"
                title="CPU"
                subtitle="All containers, last 24 hours"
              >
                <x-import
                  component-from-global-scope="Stackroost.Segmented"
                  options="{{ranges}}"
                  default-value="24H"
                  label="Range"
                ></x-import>
                <x-import
                  component-from-global-scope="Stackroost.Sparkline"
                  data="{{cpu}}"
                  width="{{chartW}}"
                  height="{{chartH}}"
                  area="{{yes}}"
                  marker="{{yes}}"
                  label="CPU, last 24 hours"
                ></x-import>
              </x-import>
            </section>
          </div>
        </main>
      </div>
    </template>
    <script>
      renderScreen({
        yes: true,
        p68: 68.5,
        p64: 64,
        chartW: 640,
        chartH: 120,
        load: [0.3, 0.42, 0.38, 0.6, 0.51, 0.47, 0.39, 0.44, 0.42],
        cpu: [
          12, 14, 11, 18, 22, 19, 28, 24, 31, 27, 22, 26, 34, 29, 25, 21, 23, 19, 17, 21, 26, 24,
          20, 18,
        ],
        sections: ['Overview', 'Containers', 'Services', 'Ports', 'Issues'],
        ranges: ['1H', '24H', '7D'],
        navItems: [
          { id: 'services', icon: 'activity', label: 'Services' },
          { id: 'servers', icon: 'server', label: 'Servers', badge: true },
          { id: 'ports', icon: 'plug', label: 'Ports' },
          { id: 'doctor', icon: 'shield', label: 'Doctor' },
          { id: 'storage', icon: 'drive', label: 'Storage' },
          { id: 'memory', icon: 'cpu', label: 'Memory' },
          { id: 'claude', icon: 'message', label: 'Claude Chats' },
        ],
        navFoot: [{ id: 'settings', icon: 'settings', label: 'Settings' }],
      });
    </script>
  </body>
</html>
