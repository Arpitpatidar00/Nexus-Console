<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stackroost — Services (Frost)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../design-system/tokens.css" />
    <link rel="stylesheet" href="../design-system/components/bundle.css" />
    <style>
      body {
        margin: 0;
      }
    </style>
    <script src="../vendor/react.production.min.js"></script>
    <script src="../vendor/react-dom.production.min.js"></script>
    <script src="../design-system/components/bundle.js"></script>
    <script src="render.js"></script>
  </head>
  <body class="theme-light">
    <div id="root"></div>
    <template id="src">
      <div
        class="theme-light sr-ground"
        style="
          min-height: 980px;
          box-sizing: border-box;
          padding: 16px;
          border-radius: 0;
          display: flex;
          flex-wrap: wrap;
          gap: 20px;
          align-items: flex-start;
          color: var(--foreground);
          font-family: var(--font-sans);
        "
      >
        <x-import
          component-from-global-scope="Stackroost.NavRail"
          items="{{navItems}}"
          footer="{{navFoot}}"
          active="services"
          label="Modules"
        ></x-import>

        <main
          style="
            flex: 999 1 560px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 8px 8px 8px 4px;
          "
        >
          <header
            style="
              display: flex;
              flex-wrap: wrap;
              justify-content: space-between;
              align-items: center;
              gap: 16px;
            "
          >
            <div style="display: flex; flex-direction: column; gap: 4px">
              <h1 class="sr-h-display">Services</h1>
              <p class="sr-caption">Homebrew · 6 managed · 4 running</p>
            </div>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
              <x-import
                component-from-global-scope="Stackroost.SearchField"
                placeholder="Search services and formulae"
                shortcut="⌘K"
                label="Search services"
                style="width: 320px; max-width: 100%"
              ></x-import>
              <x-import
                component-from-global-scope="Stackroost.Segmented"
                options="{{filters}}"
                default-value="All"
                label="Filter"
              ></x-import>
              <x-import component-from-global-scope="Stackroost.Button" icon="plus"
                >Add service</x-import
              >
            </div>
          </header>

          <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
            <x-import
              component-from-global-scope="Stackroost.Panel"
              variant="inverse"
              title="Fameo workspace"
              subtitle="Everything Fameo needs, in one click."
              action-label="Start workspace"
              action-icon="play"
              style="flex: 1 1 360px; min-width: 0"
            >
              <div
                style="
                  display: flex;
                  flex-wrap: wrap;
                  gap: 8px;
                  font: 500 13px/18px var(--font-mono);
                "
              >
                <span
                  style="
                    padding: 6px 12px;
                    border-radius: 999px;
                    border: 1px solid rgba(255, 255, 255, 0.2);
                  "
                  >postgresql@18</span
                >
                <span
                  style="
                    padding: 6px 12px;
                    border-radius: 999px;
                    border: 1px solid rgba(255, 255, 255, 0.2);
                  "
                  >redis</span
                >
                <span
                  style="
                    padding: 6px 12px;
                    border-radius: 999px;
                    border: 1px solid rgba(255, 255, 255, 0.2);
                  "
                  >prod-db → :5433</span
                >
                <span
                  style="
                    padding: 6px 12px;
                    border-radius: 999px;
                    border: 1px solid rgba(255, 255, 255, 0.2);
                  "
                  >npm run dev</span
                >
              </div>
            </x-import>
            <x-import
              component-from-global-scope="Stackroost.Panel"
              style="flex: 1 1 360px; min-width: 0"
              aria-label="Summary"
            >
              <div style="display: flex; flex-wrap: wrap; gap: 32px">
                <x-import
                  component-from-global-scope="Stackroost.Metric"
                  value="4"
                  unit="of 6"
                  label="Services running"
                  tone="success"
                  progress="{{p66}}"
                ></x-import>
                <x-import
                  component-from-global-scope="Stackroost.Metric"
                  value="1.8"
                  unit="GB"
                  label="Memory used by services"
                  tone="ember"
                  spark="{{mem}}"
                ></x-import>
              </div>
            </x-import>
          </div>

          <div
            style="
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
              gap: 20px;
            "
          >
            <x-import
              component-from-global-scope="Stackroost.Panel"
              title="postgresql@18"
              subtitle="localhost:5432 · linked"
            >
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  gap: 12px;
                "
              >
                <x-import
                  component-from-global-scope="Stackroost.Badge"
                  tone="success"
                  dot="{{yes}}"
                  >Healthy</x-import
                ><span class="sr-eyebrow">CPU 2% · 412 MB</span>
              </div>
              <x-import
                component-from-global-scope="Stackroost.Sparkline"
                data="{{s1}}"
                width="{{sw}}"
                height="{{sh}}"
                area="{{yes}}"
                label="postgresql CPU"
              ></x-import>
              <div style="display: flex; gap: 8px">
                <x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="outline"
                  size="sm"
                  icon="stop"
                  >Stop</x-import
                ><x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="glass"
                  size="sm"
                  icon="terminal"
                  >psql</x-import
                ><x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="ghost"
                  size="sm"
                  icon="list"
                  >Logs</x-import
                >
              </div>
            </x-import>

            <x-import
              component-from-global-scope="Stackroost.Panel"
              title="redis"
              subtitle="localhost:6379 · linked"
            >
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  gap: 12px;
                "
              >
                <x-import
                  component-from-global-scope="Stackroost.Badge"
                  tone="success"
                  dot="{{yes}}"
                  >Healthy</x-import
                ><span class="sr-eyebrow">CPU 1% · 38 MB</span>
              </div>
              <x-import
                component-from-global-scope="Stackroost.Sparkline"
                data="{{s2}}"
                width="{{sw}}"
                height="{{sh}}"
                area="{{yes}}"
                label="redis CPU"
              ></x-import>
              <div style="display: flex; gap: 8px">
                <x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="outline"
                  size="sm"
                  icon="stop"
                  >Stop</x-import
                ><x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="glass"
                  size="sm"
                  icon="terminal"
                  >redis-cli</x-import
                ><x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="ghost"
                  size="sm"
                  icon="list"
                  >Logs</x-import
                >
              </div>
            </x-import>

            <x-import
              component-from-global-scope="Stackroost.Panel"
              title="mongodb-community"
              subtitle="localhost:27017 · this session"
            >
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  gap: 12px;
                "
              >
                <x-import
                  component-from-global-scope="Stackroost.Badge"
                  tone="warning"
                  dot="{{yes}}"
                  >Starting</x-import
                ><span class="sr-eyebrow">waiting for ping</span>
              </div>
              <x-import
                component-from-global-scope="Stackroost.Sparkline"
                data="{{s3}}"
                width="{{sw}}"
                height="{{sh}}"
                area="{{yes}}"
                label="mongodb CPU"
              ></x-import>
              <div style="display: flex; gap: 8px">
                <x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="outline"
                  size="sm"
                  icon="stop"
                  >Stop</x-import
                ><x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="glass"
                  size="sm"
                  icon="terminal"
                  >mongosh</x-import
                ><x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="ghost"
                  size="sm"
                  icon="list"
                  >Logs</x-import
                >
              </div>
            </x-import>

            <x-import
              component-from-global-scope="Stackroost.Panel"
              title="rabbitmq"
              subtitle="localhost:5672 · linked"
            >
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  gap: 12px;
                "
              >
                <x-import
                  component-from-global-scope="Stackroost.Badge"
                  tone="success"
                  dot="{{yes}}"
                  >Healthy</x-import
                ><span class="sr-eyebrow">CPU 3% · 141 MB</span>
              </div>
              <x-import
                component-from-global-scope="Stackroost.Sparkline"
                data="{{s4}}"
                width="{{sw}}"
                height="{{sh}}"
                area="{{yes}}"
                label="rabbitmq CPU"
              ></x-import>
              <div style="display: flex; gap: 8px">
                <x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="outline"
                  size="sm"
                  icon="stop"
                  >Stop</x-import
                ><x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="ghost"
                  size="sm"
                  icon="list"
                  >Logs</x-import
                >
              </div>
            </x-import>

            <x-import
              component-from-global-scope="Stackroost.Panel"
              title="nginx"
              subtitle="localhost:8080 · linked"
            >
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  gap: 12px;
                "
              >
                <x-import component-from-global-scope="Stackroost.Badge" dot="{{yes}}"
                  >Stopped</x-import
                ><span class="sr-eyebrow">stopped 2 h ago</span>
              </div>
              <div style="height: 44px"></div>
              <div style="display: flex; gap: 8px">
                <x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="ember"
                  size="sm"
                  icon="play"
                  >Start</x-import
                ><x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="ghost"
                  size="sm"
                  icon="list"
                  >Logs</x-import
                >
              </div>
            </x-import>

            <x-import
              component-from-global-scope="Stackroost.Panel"
              title="mysql"
              subtitle="localhost:3306 · not linked"
            >
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  gap: 12px;
                "
              >
                <x-import component-from-global-scope="Stackroost.Badge" dot="{{yes}}"
                  >Stopped</x-import
                ><span class="sr-eyebrow">port 3306 in use by docker</span>
              </div>
              <div style="height: 44px"></div>
              <div style="display: flex; gap: 8px">
                <x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="ember"
                  size="sm"
                  icon="play"
                  >Start</x-import
                ><x-import
                  component-from-global-scope="Stackroost.Button"
                  variant="ghost"
                  size="sm"
                  icon="plug"
                  >See port</x-import
                >
              </div>
            </x-import>
          </div>

          <x-import
            component-from-global-scope="Stackroost.Panel"
            title="Ports"
            subtitle="Listening now"
            action-label="Open Ports"
            action-icon="plug"
          >
            <x-import
              component-from-global-scope="Stackroost.ListRow"
              icon="plug"
              title=":3000 · node"
              subtitle="~/Desktop/fameo-web · PID 48213"
              meta="CPU 0% · 96 MB"
              ><x-import component-from-global-scope="Stackroost.Badge" tone="warning" dot="{{yes}}"
                >Detached</x-import
              ><x-import
                component-from-global-scope="Stackroost.Button"
                variant="destructive"
                size="sm"
                icon="x"
                >Kill</x-import
              ></x-import
            >
            <x-import
              component-from-global-scope="Stackroost.ListRow"
              icon="tunnel"
              title=":5433 · ssh"
              subtitle="tunnel → fameo-prod postgres"
              meta="open 41 min"
              ><x-import component-from-global-scope="Stackroost.Badge" tone="danger" dot="{{yes}}"
                >PROD tunnel</x-import
              ></x-import
            >
            <x-import
              component-from-global-scope="Stackroost.ListRow"
              icon="database"
              title=":5432 · postgres"
              subtitle="/opt/homebrew/var/postgresql@18"
              meta="CPU 2% · 412 MB"
              ><x-import component-from-global-scope="Stackroost.Badge" tone="success" dot="{{yes}}"
                >Homebrew</x-import
              ></x-import
            >
          </x-import>
        </main>
      </div>
    </template>
    <script>
      renderScreen({
        yes: true,
        p66: 66.7,
        sw: 240,
        sh: 44,
        mem: [1.2, 1.3, 1.5, 1.4, 1.6, 1.7, 1.9, 1.8],
        s1: [2, 3, 2, 4, 3, 5, 3, 2, 3, 2],
        s2: [1, 1, 2, 1, 1, 2, 1, 1, 2, 1],
        s3: [0, 1, 4, 9, 14, 12, 16, 18, 15, 17],
        s4: [3, 4, 3, 3, 5, 4, 3, 4, 3, 3],
        filters: ['All', 'Running', 'Stopped'],
        navItems: [
          { id: 'services', icon: 'activity', label: 'Services' },
          { id: 'servers', icon: 'server', label: 'Servers', badge: true },
          { id: 'ports', icon: 'plug', label: 'Ports' },
          { id: 'doctor', icon: 'shield', label: 'Doctor' },
          { id: 'storage', icon: 'drive', label: 'Storage' },
          { id: 'memory', icon: 'cpu', label: 'Memory' },
          { id: 'claude', icon: 'message', label: 'Claude Chats' },
        ],
        navFoot: [{ id: 'settings', icon: 'settings', label: 'Settings' }],
      });
    </script>
  </body>
</html>
